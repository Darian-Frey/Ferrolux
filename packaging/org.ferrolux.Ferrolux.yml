#
# Flatpak manifest for Ferrolux RS-1.
#
# Built, installed and checked by `tools/verify-flatpak.sh`, which is the tool
# to run after any change here. It builds against `org.kde.Platform` 6.10, six
# minor versions ahead of the Qt 6.4.2 that BUILD.md pins and every figure in
# BENCHMARKS.md was taken on; the first build produced eight deprecation
# warnings and no errors, and the application ran. BUG-023's `qrc:/qt/qml`
# import path is still needed there, or at least still harmless.
#
#     sudo apt install flatpak-builder
#     flatpak install flathub org.kde.Platform//6.10 org.kde.Sdk//6.10
#     tools/verify-flatpak.sh
#
# The first draft of this file said it had never been built, and it had not.
# The first build then found three defects, each caught by the export rather
# than by anything of ours: an icon gdk-pixbuf could not recognise (BUG-033,
# and it had never loaded on any GTK desktop either), a desktop entry whose
# `Icon=` line pointed at a file the rename had removed, and a settings-daemon
# bus name the sandbox was not allowed to talk to, so media keys silently fell
# back to the X11 grab. Each is explained where it is fixed below.
app-id: org.ferrolux.Ferrolux
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: ferrolux

# Flatpak requires the desktop entry and icon to be named for the app id, and
# this project names them `ferrolux` — see `setDesktopFileName` in `src/main.cpp`
# and the check in `tests/spec_test`. These two keys rename both and rewrite the
# `Icon=` line inside the entry to match. They are manifest-level keys, not
# module-level ones: the first draft put them under the module, where they were
# silently ignored, and the export then refused a desktop file whose name was
# not the app id. Before that, an earlier draft did the renames by hand with
# `install` and `rm` and left `Icon=ferrolux` pointing at a file that no longer
# existed — which the export also refused, correctly both times.
rename-desktop-file: ferrolux.desktop
rename-icon: ferrolux

finish-args:
  # Display. Wayland first, X11 as the fallback — `platform/X11MediaKeys` is
  # compiled in but only used where there is no settings daemon (F-051).
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The shaders are the product. Without this the meters fall back to software
  # rendering, where AV-002's frame budget is not a question worth asking.
  - --device=dri
  - --socket=pulseaudio

  # Music lives outside the sandbox. Read-only: the player reads files and
  # writes only its own settings and session, which stay in the app's data
  # directory.
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro

  # The two names the application claims for itself. Without the first there is
  # no MPRIS at all (F-050); without the second every launch starts a new player
  # instead of handing its arguments to the running one (F-052).
  - --own-name=org.mpris.MediaPlayer2.ferrolux
  - --own-name=org.ferrolux.Ferrolux

  # Media keys, F-051. GNOME, Cinnamon and MATE hand the keys to whoever
  # registered last through a settings daemon; none of them routes them over
  # MPRIS. `platform/MediaKeys` tries three bus names in turn, and all three
  # have to be allowed — the first build of this listed only the first, and
  # inside the sandbox on Cinnamon (which answers on the second) the player
  # found no daemon and fell back to grabbing the keys on the X root window.
  # That works, but it is the wrong path for a desktop that has a daemon: a
  # grab holds the keys for the whole run, where a registration hands them back
  # to whichever player is active (IMP-009).
  - --talk-name=org.gnome.SettingsDaemon.MediaKeys
  - --talk-name=org.gnome.SettingsDaemon
  - --talk-name=org.mate.SettingsDaemon

modules:
  # No TagLib module. The KDE runtime ships TagLib 2.1.1 already, against the
  # 1.12 minimum `CMakeLists.txt` asks for — and building a second copy would be
  # a second copy to keep in step. The first draft of this manifest carried one,
  # with a checksum left deliberately wrong so the build would fail rather than
  # fetch an unverified tarball; it was never needed.
  #
  # The runtime also carries every GStreamer plugin the pipeline uses — playback,
  # typefind, the audio parsers, FLAC, Vorbis, WavPack, MP3, Opus, WAV, AIFF, the
  # tag demuxers, `level`, `spectrum`, `equalizer`, `audiomixmatrix` and the
  # PulseAudio and PipeWire sinks — with one exception: Musepack. That is one of
  # F-001's ten formats, and inside the sandbox it will not play until a
  # `gst-plugins-bad` build with `musepack` enabled is added here.
  - name: ferrolux
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    sources:
      - type: dir
        path: ..
        # Everything a build does not need, and everything that is not source.
        # The build trees alone are hundreds of megabytes, and the fixtures are
        # audio that never belongs in a package.
        skip:
          - build-release
          - build-debug
          - build-flatpak
          - .flatpak-builder
          - fixtures
          - .git
